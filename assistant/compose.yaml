services:
  assistant-ui:
    container_name: homelab-assistant-ui
    image: nginx:alpine
    ports:
      - "8081:80"
    volumes:
      - "./frontend:/usr/share/nginx/html:ro"
      - "./nginx.conf:/etc/nginx/conf.d/default.conf:ro"
    depends_on:
      - assistant-api
    restart: unless-stopped

  assistant-api:
    container_name: homelab-assistant-api
    build: ./backend
    restart: unless-stopped
